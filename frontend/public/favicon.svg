<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="EhParkLeh">
  <!-- Logos.dc.html take A, "Sign P": the parking-sign tile in kaya green.
       The P is drawn as geometry rather than set in Baloo 2 on purpose — a
       favicon renders outside the page, with none of the app's webfonts
       loaded, so type here would fall back to whatever the browser has.
       One path, not a stem rect unioned with a bowl rect: overlapping rects
       leave a visible notch where their corner radii meet. -->
  <rect width="64" height="64" rx="15" fill="#1C6E4A"/>
  <path
    d="M18 15.5A3.5 3.5 0 0 1 21.5 12L34 12A13 13 0 0 1 34 38L30 38L30 48.5A3.5 3.5 0 0 1 26.5 52L21.5 52A3.5 3.5 0 0 1 18 48.5Z"
    fill="#FFF8EA"
  />
  <rect x="30" y="20" width="9" height="10" rx="4.5" fill="#1C6E4A"/>
</svg>
