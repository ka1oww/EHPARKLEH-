# Per-repo no-mistakes overrides.

# Pin the Test step to the same deterministic suites .github/workflows/ci.yml
# runs (backend pytest + frontend vitest), instead of leaving the step to an
# agent-driven run. The command bootstraps its own environment when the
# pipeline worktree has none.
commands:
  test: bash -c 'set -e; cd backend; [ -x .venv/bin/python ] || { python3 -m venv .venv && .venv/bin/pip install -q -r requirements.txt; }; .venv/bin/python -m pytest tests -q; cd ../frontend; [ -d node_modules ] || npm ci --silent; npm test -- --run'
