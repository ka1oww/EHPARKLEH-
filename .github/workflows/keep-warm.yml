name: keep-backend-warm

# Render's free tier spins the backend down after ~15 min idle, so the next
# request pays a ~50s cold start. Pinging /health every ~10 min keeps the demo
# backend responsive. Best-effort: GitHub may delay scheduled runs under load
# and disables schedules after 60 days of repository inactivity.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend /health
        run: |
          curl -sS --max-time 70 --retry 2 --retry-all-errors \
            https://ehparkleh-backend.onrender.com/health || true
