# Infrastructure-as-code for the EhParkLeh backend on Render.
#
# NOTE: an existing manually-created service does NOT auto-adopt this file.
# To make the live service match, either (a) in the Render dashboard set the
# Build Command to `pip install -r requirements.txt` and the Start Command +
# Health Check Path below, or (b) recreate the service via a Blueprint deploy
# pointed at this file. Secrets (sync:false) are still set in the dashboard.
services:
  - type: web
    name: ehparkleh-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Set the actual values in the Render dashboard; never commit them.
      - key: LTA_DATAMALL_KEY
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
